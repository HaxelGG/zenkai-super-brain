<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ZENKAI">
  <!--
    Marca ZENKAI para iconos. A 16px el wordmark completo es ilegible, así que
    el icono usa el único glifo propio del logotipo: la Λ azul de la "A" de ZENKAI.
    Fuente de verdad de apple-touch-icon.png y favicon.ico (ver README de public/).
  -->
  <defs>
    <linearGradient id="zk-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E6FFF"/>
      <stop offset="100%" stop-color="#6FB4FF"/>
    </linearGradient>
    <linearGradient id="zk-streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8CC5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1E6FFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#08080C"/>
  <polyline points="104,392 256,124 408,392" fill="none" stroke="url(#zk-accent)"
            stroke-width="58" stroke-linejoin="miter" stroke-linecap="butt"/>
  <rect x="104" y="428" width="304" height="6" rx="3" fill="url(#zk-streak)"/>
</svg>
